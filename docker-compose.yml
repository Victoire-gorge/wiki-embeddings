services:
  db:
    image: postgres:16
    container_name: wiki-embeddings-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: triple_performance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  qdrant:
    image: qdrant/qdrant:latest
    container_name: wiki-embeddings-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wiki-embeddings-app
    restart: unless-stopped
    depends_on:
      - db
      - qdrant
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/triple_performance
      QDRANT_URL: http://qdrant:6333
    volumes:
      - .:/app
    command: python -m app.main

volumes:
  postgres_data:
  qdrant_data:
