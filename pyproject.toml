[tool.poetry]
name = "triple-performance-embeddings"
version = "0.1.0"
description = "Semantic indexing project for Triple Performance wiki"
authors = ["Neayi <contact@neayi.com>"]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
psycopg = {version = "^3.12.0", extras = ["binary"]}
qdrant-client = "^1.10.0"
openai = "^1.50.0"
pydantic = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core>=1.8.1"]
build-backend = "poetry.core.masonry.api"
